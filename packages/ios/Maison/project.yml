name: Maison
options:
  bundleIdPrefix: fr.webpremiere
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  DomoKit:
    path: ../DomoKit

targets:
  Maison:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: DomoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.webpremiere.maison
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: La Ruche
    info:
      path: Sources/Info.plist
      properties:
        # SANS cette clé, iOS considère l'app comme héritée et la fait tourner
        # en résolution réduite, avec des bandes noires en haut et en bas.
        # Le réglage INFOPLIST_KEY_* ne sert à rien ici : il n'alimente que les
        # Info.plist *générés*, or on en fournit un.
        UILaunchScreen:
          UIColorName: ""

        # Sans ces deux clés, iOS bloque la découverte du serveur et l'app
        # ne trouverait jamais la maison sur le réseau local.
        NSLocalNetworkUsageDescription: >-
          Maison cherche votre serveur domotique sur le réseau local.
        NSBonjourServices:
          - _domotique._tcp
        # Le serveur est chez vous, en HTTP : c'est volontaire. Rien ne sort
        # sur Internet, donc rien à chiffrer pour un tiers.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Liens profonds : `maison://zone/z03`. Sert à la vérification, et
        # servira aux raccourcis Siri et aux widgets.
        CFBundleURLTypes:
          - CFBundleURLName: fr.webpremiere.maison
            CFBundleURLSchemes: [maison]

  MaisonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Maison
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.webpremiere.maison.uitests
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Maison
        # La cible de test n'a pas d'Info.plist a elle : Xcode le genere.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Maison:
    build:
      targets:
        Maison: all
        MaisonUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [MaisonUITests]
